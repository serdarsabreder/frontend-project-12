<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hexlet Chat</title>
    <style>
        :root {
            --bg-color: #f5f6f7;
            --sidebar-bg: #ffffff;
            --text-main: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-blue: #3498db;
            --selected-bg: #e8f4fd;
            --border-color: #e1e4e8;
            --input-border: #b6c6d4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 56px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }

        .logout-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #2980b9;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-channel-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .channels-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
        }

        .channel-item {
            padding: 12px 16px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .channel-item:hover {
            background-color: var(--selected-bg);
        }

        .channel-item.active {
            background-color: #dbeafe;
            color: var(--text-main);
            font-weight: 600;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
        }

        .chat-header span {
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 8px;
        }

        .messages-area {
            flex: 1;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: var(--accent-blue);
        }

        .send-btn {
            background-color: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
        }

        .send-btn:hover {
            background-color: var(--selected-bg);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hexlet Chat</h1>
        <button class="logout-btn">Выйти</button>
    </div>
    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>Каналы</span>
                <button class="add-channel-btn">+</button>
            </div>
            <ul class="channels-list">
                <li class="channel-item"># general</li>
                <li class="channel-item active"># random</li>
            </ul>
        </aside>
        <main class="chat-area">
            <div class="chat-header">
                <span># random</span>
                <span>0 сообщений</span>
            </div>
            <div class="messages-area">
                <!-- Область для сообщений -->
            </div>
            <div class="input-area">
                <input type="text" class="message-input" placeholder="Введите сообщение...">
                <button class="send-btn">➤</button>
            </div>
        </main>
    </div>
</body>
</html>
